name: Release Charts

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Dovakiin0"
          git config user.email "dovakiin0@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"

      - name: Sync README to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add ./gh-pages-worktree origin/gh-pages
          cp README.md ./gh-pages-worktree/README.md
          cd ./gh-pages-worktree
          if [ -n "$(git status --porcelain README.md)" ]; then
            git add README.md
            git commit -m "docs: sync README.md to gh-pages"
            git push origin gh-pages
          fi
          cd ..
          git worktree remove ./gh-pages-worktree
